  <!-- Only layout additions (keeps your existing hover/overlay/blur effects in styles.css) -->
  <style>
    .single-portfolio {
      min-height: calc(100vh - 160px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 28px 0 40px;
    }

    /* viewer width for horizontal images */
    .single-portfolio .card {
      width: min(620px, 92vw);
      margin: 0;
    }

    /* default: horizontal images fill width */
    .single-portfolio .card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* portrait images: smaller (height-capped) */
    .single-portfolio .card img.is-portrait {
      width: auto;
      max-width: 92vw;
      max-height: 68vh;
      /* tweak 55vh-75vh */
      margin: 0 auto;
    }

    .randomize-btn {
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .06);
      color: inherit;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform .15s ease, background .15s ease;
    }

    .randomize-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .10);
    }

    .randomize-btn:active {
      transform: translateY(0) scale(.98);
    }
  </style>
</head>

      const cardImg = document.getElementById("cardImg");
      const cardTitle = document.getElementById("cardTitle");
      const cardDesc = document.getElementById("cardDesc");
      const btn = document.getElementById("randomBtn");

      let last = -1;

      const pick = () => {
        if (items.length <= 1) return 0;
        let i = Math.floor(Math.random() * items.length);
        while (i === last) i = Math.floor(Math.random() * items.length);
        return i;
      };

      const render = (i) => {
        const it = items[i];
        last = i;

        cardLink.href = it.src;

        cardLink.classList.remove("is-portrait");

        cardImg.onload = () => {
          const portrait = cardImg.naturalHeight > cardImg.naturalWidth;
          cardLink.classList.toggle("is-portrait", portrait);
        };

        cardImg.src = it.src;
        cardImg.alt = it.alt || "";

        cardTitle.textContent = it.title || "";
        cardDesc.innerHTML = it.desc || "";
      };

      const randomize = () => render(pick());

      window.addEventListener("DOMContentLoaded", randomize);
      btn.addEventListener("click", randomize);
    })();
